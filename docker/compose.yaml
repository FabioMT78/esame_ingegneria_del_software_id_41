services:
  app:
    image: node:24.21.0-alpine3.24
    working_dir: /workspace

    env_file:
      - .env

    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine3.24

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
  postgres_data:
  