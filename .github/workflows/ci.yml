name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp docker/.env.example docker/.env

      - name: Verify project in container
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/compose.yaml \
            run --rm --no-deps app \
            sh -c "npm ci && npm run verify"
            