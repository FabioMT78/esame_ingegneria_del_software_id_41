name: CI

on:
  push:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp docker/.env.example docker/.env

      - name: Start PostgreSQL
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/compose.yaml \
            up -d --wait db

      - name: Verify project in container
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/compose.yaml \
            run --rm --no-deps app \
            sh -c "npm ci && npm run verify"

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/compose.yaml \
            down -v
            